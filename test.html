
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Password Manager</title>
    </head>

    <style>
        #container {
            position: relative;
            width: 450px;
            height: 300px;
            background: darkgray;
        }
        .menu {
            font-size: 5rem;
            position: absolute;
            right: 0;
            top: 0;
        }
        .selected{
            border: 2px solid black;
        }
        .current{
            border: 2px solid black;
        }
        .stage.visible { 
            display: block;
        }    
        .stage {
            display: none;
        }
    </style>
    <body>
        <div id="container">
            <div class="stage stage1 visible">
                <h3 class="el">1. Service 1</h3>
                <h3 class="el">2. Service 2</h3>
                <h3 class="el">3. Service 3</h3>
                <h3 class="el">4. Service 4</h3>
                <h3 class="el">5. Service 5</h3>
            </div>
            <div class="stage stage2">
                <h3>Service</h3>
                <h4>Login</h4>
                <h4>Password</h4>
            </div>
            <div class="stage stage3">
                <h3>1. Enable bluetooth</h3>
                <h3>2. Re-generate</h3>
                <h3>3. Ver 0.0.1</h3>
            </div>
            <div class="menu">
                <div class="uarr current">&uarr;</div>
                <div class="ent">></div>
                <div class="darr"">&darr;</div>
            </div>
        </div>
        <div id="output"></div>
        <script>
            let graceTo;
            let to;
            let isDoubleClick = false;
            let isTripleClick = false;
            let isLongClick = false;

            let curListStage = 0;

            function rotMenu() {

                const current = document.querySelector('.current');
                if (current.nextElementSibling) {
                    current.classList.remove('current');
                    current.nextElementSibling.classList.add('current');
                }else {
                    current.classList.remove('current');
                    document.querySelector('.menu div').classList.add('current')
                }
            }
            function rotInnerList(inc = 1) {
                const current = document.querySelector('.selected');
                if (inc === 1) {

                    if (current.nextElementSibling) {
                        current.classList.remove('selected');
                        current.nextElementSibling.classList.add('selected');
                    }else {
                        current.classList.remove('selected');
                        document.querySelector('.el').classList.add('selected')
                    }
                }else{

                    if (current.previousElementSibling) {
                        current.classList.remove('selected');
                        current.previousElementSibling.classList.add('selected');
                    }else {
                        current.classList.remove('selected');
                        document.querySelector('.el:last-child').classList.add('selected')
                    }

                }
            }
            function rotList(inc = 1) {

                if(inc === -1) {

                    if (curListStage > 0) {
                        curListStage += inc;
                    } else {
                        curListStage = 4;
                    }
                } else {
                    if (curListStage < 4) {
                        curListStage += inc;
                    } else {
                        curListStage = 0;
                    }
                }
                const list = document.querySelector('.stage1');
                Array.from(list.querySelectorAll('h3'))
                .forEach((it, ind) => {
                    it.innerText = `${curListStage * 5 + ind + 1}. Service ${curListStage * 5 + ind + 1}`
                });
            }
            function handle() {

                window.output.innerText = isTripleClick ? 'click X3' : (isDoubleClick ? 'click X2': 'click X1');
                if (isTripleClick) {               

                    if (document.querySelector('.stage2').classList.contains('visible')) {

                                document.querySelector('.stage2').classList.remove('visible')
                                document.querySelector('.stage1').classList.add('visible')
                    }else
                    if (document.querySelector('.stage1').classList.contains('visible')) {

                        if(document.querySelector('.stage1').querySelector('.selected')){
                            document.querySelector('.stage1').querySelector('.selected').classList.remove('selected');
                        }
                    }
                }else if (isDoubleClick) {

                    rotMenu();
                } else {
                    if (document.querySelector('.stage1').classList.contains('visible')) {
                        if(document.querySelector('.stage1').querySelector('.selected')){
                            if (document.querySelector('.menu .uarr').classList.contains('current')) {
                                rotInnerList(-1);
                            } else if (document.querySelector('.menu .darr').classList.contains('current')) {

                                rotInnerList();

                            } else if (document.querySelector('.menu .ent').classList.contains('current')) {
                                document.querySelector('.stage1').classList.remove('visible')
                                document.querySelector('.stage2').classList.add('visible')
                            }
                        }else {

                            if (document.querySelector('.menu .uarr').classList.contains('current')) {
                                rotList(-1);
                            } else if (document.querySelector('.menu .darr').classList.contains('current')) {

                                rotList();

                            } else if (document.querySelector('.menu .ent').classList.contains('current')) {
                                document.querySelector('.stage1 .el').classList.add('selected')
                            }
                        }
                    }
                }
                to = null;
                clearTimeout(graceTo);
                isDoubleClick = false;
                isTripleClick = false;
                isLongClick = false;
                graceTo = setTimeout(() => {
                    window.output.innerText = '';
                }, 3000);
            }
            window.addEventListener('keypress', (evt) => {
                evt.preventDefault();
                if (to) {
                    if (isDoubleClick) {
                        isTripleClick = true;
                    }
                    isDoubleClick = true;
                }
                clearTimeout(to);
                to = setTimeout(() => {
                    handle();
                }, 300);
            });
        </script>
    </body>
  </html>
